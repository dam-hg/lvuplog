<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVUP.log — 당신의 업무 경험치를 기록하세요</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --bg1:#e9efe3; --bg2:#e2e8db;
    --green-d:#1f7a3a; --green-m:#23a14e; --green-l:#dcefd6;
    --green-card:#f0f6ec; --green-soft:#eef4ea;
    --ink:#1c2420; --muted:#8b958d; --red:#e8645a; --white:#fff;
    --line:#ebeeea;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  html,body{height:100%;}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);overflow:hidden;height:100vh;box-sizing:border-box;padding:2.4vh 2.6vw;}
  /* 전체 UI를 87%로 축소하고 바깥 여백 확보 (1/0.87 = 114.943%) */
  #login,#wsSelect,#app{width:114.943%;height:114.943%;transform:scale(.87);transform-origin:top left;position:relative;z-index:1;}
  #wsSelect{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9vh;}
  button{cursor:pointer;border:none;background:none;font-size:1rem;color:inherit;}
  input,textarea{font-size:1rem;outline:none;border:none;}
  .hidden{display:none!important;}

  /* ---------- LOGIN ---------- */
  #login{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9vh;}
  .logo{font-size:2.6rem;font-weight:800;color:var(--green-d);letter-spacing:1px;}
  .logo .dot{position:relative;}
  .logo .sprout{font-size:1.4rem;position:relative;top:-2px;}
  .tagline{color:var(--muted);font-size:1.4rem;font-weight:600;margin-top:14px;animation:tagwave 3.2s ease-in-out infinite;}
  @keyframes tagwave{0%,100%{transform:translateY(-7px);}50%{transform:translateY(7px);}}
  .loadbar{width:460px;max-width:80vw;height:13px;border-radius:10px;background:#ffffff88;margin-top:26px;overflow:hidden;}
  .loadbar>i{display:block;height:100%;width:62%;border-radius:10px;background:linear-gradient(90deg,#bfe6a0,#3ec43e);}
  .login-box{margin-top:70px;display:flex;flex-direction:column;align-items:center;gap:18px;width:440px;max-width:88vw;}
  .login-box h2{font-size:1.5rem;color:var(--ink);margin-bottom:6px;}
  .login-box input{width:100%;background:#fff;border-radius:16px;padding:20px 26px;font-size:1.1rem;box-shadow:0 2px 8px #0000000d;}
  .login-box button{width:100%;background:var(--green-m);color:#fff;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:700;margin-top:6px;}
  .login-hint{color:var(--muted);font-size:.85rem;margin-top:4px;text-align:center;line-height:1.5;}

  /* ---------- TOP BAR ---------- */
  #app{display:none;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;flex-shrink:0;}
  .topbar .logo{font-size:1.7rem;}
  .nav-btn{border:1px solid var(--line);border-radius:14px;padding:12px 24px;font-weight:600;font-size:1.02rem;background:#fff;color:#566;}
  .nav-btn.active{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .search-wrap{flex:1;position:relative;max-width:560px;margin:0 auto;}
  .search-wrap input{width:100%;background:#fff;border-radius:30px;padding:15px 50px 15px 24px;font-size:1.05rem;box-shadow:0 1px 6px #0000000d;}
  .search-wrap .ico{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--green-d);font-size:1.2rem;}
  .search-results{position:absolute;top:54px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;max-height:60vh;overflow:auto;z-index:50;}
  .search-results .sr{padding:12px 18px;border-bottom:1px solid #eee;cursor:pointer;}
  .search-results .sr:hover{background:var(--green-card);}
  .search-results .sr small{color:var(--muted);}
  .search-results .empty{padding:18px;color:var(--muted);text-align:center;}
  .pill{border-radius:14px;padding:12px 22px;font-weight:700;}
  .pill.ghost{border:1px solid var(--line);background:#fff;color:#566;font-weight:600;}
  .pill.red{background:var(--red);color:#fff;}

  .body{flex:1;overflow:hidden;}

  /* ---------- PROJECTS VIEW ---------- */
  .proj-layout{display:flex;height:100%;}
  .proj-main{flex:1;overflow:auto;padding:6px 30px 30px;}
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 26px;}
  .proj-card{background:var(--green-card);border:1.5px solid var(--line);border-radius:16px;height:150px;position:relative;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
  .proj-card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #0000001a;}
  .proj-card.new{background:var(--green-soft);align-items:center;justify-content:center;font-size:1.15rem;font-weight:700;color:var(--green-d);border-style:dashed;}
  .proj-card .xp{position:absolute;right:12px;bottom:12px;background:#bfe6a0;color:#1f5d24;font-weight:700;border-radius:8px;padding:4px 10px;font-size:.85rem;}
  .proj-card .xp.zero{background:#cfcfcf;color:#666;}
  .proj-card .status{align-self:flex-start;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;}
  .st-ing{background:#cdeccd;color:#1f5d24;}
  .st-done{background:#bcdcff;color:#1d4e89;}
  .st-hold{background:#ffe1ad;color:#8a5b00;}
  .proj-name{margin-top:10px;font-weight:700;font-size:1.18rem;color:var(--ink);}
  .proj-meta{margin-top:auto;color:var(--muted);font-size:.8rem;}
  .proj-title{font-weight:700;font-size:1.2rem;padding:4px 0 16px;color:var(--ink);}

  .side{width:300px;flex-shrink:0;background:#e2f1d8;border-radius:18px;margin:6px 18px 18px 0;padding:22px;display:flex;flex-direction:column;align-items:center;}
  .level-num{font-size:1.8rem;font-weight:800;color:var(--green-d);}
  .avatar{width:200px;height:200px;background:#fff;border-radius:18px;margin:16px 0 6px;display:flex;align-items:center;justify-content:center;font-size:4rem;}
  .lvbar{width:100%;height:10px;border-radius:8px;background:#ffffffaa;overflow:hidden;margin-top:6px;}
  .lvbar>i{display:block;height:100%;background:linear-gradient(90deg,#bfe6a0,#3ec43e);}
  .lvbar-label{align-self:stretch;color:var(--muted);font-size:.78rem;margin-top:6px;text-align:right;}
  .skills-title{align-self:flex-start;font-weight:700;margin:22px 0 10px;color:var(--ink);}
  .skills{align-self:stretch;display:flex;flex-wrap:wrap;gap:8px;}
  .skill{background:var(--green-d);color:#fff;border-radius:8px;padding:6px 12px;font-size:.85rem;display:flex;gap:6px;align-items:center;}
  .skill b{cursor:pointer;opacity:.6;}
  .skill-add{border:1.5px dashed var(--green-d);color:var(--green-d);border-radius:8px;padding:6px 12px;font-size:.85rem;}

  /* ---------- PROJECT DETAIL + ARCHIVE ---------- */
  .detail{height:100%;overflow:auto;padding:6px 48px 40px;max-width:1340px;margin:0 auto;}
  .detail-head{display:flex;align-items:center;gap:14px;padding:6px 0 16px;}
  .detail-head .back{font-size:1.6rem;cursor:pointer;color:var(--green-d);line-height:1;}
  .detail-head h2{font-size:1.5rem;color:var(--ink);}
  .crumb{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:9px;white-space:nowrap;}
  /* 완료 항목: 회색 처리 + 뒤로 정렬 */
  .proj-card.done,.arc-card.done{opacity:.55;filter:grayscale(.7);}
  .proj-card.done:hover,.arc-card.done:hover{opacity:.85;filter:grayscale(.2);}
  .detail-head .spacer{flex:1;}
  .add-archive{background:var(--green-m);color:#fff;border-radius:14px;padding:12px 22px;font-weight:700;}
  .detail-status{display:flex;gap:8px;margin-bottom:20px;align-items:center;}
  .detail-status .opt{border:1.5px solid var(--line);border-radius:20px;padding:7px 18px;font-weight:600;font-size:.85rem;cursor:pointer;background:#fff;}
  .detail-status .opt.sel{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .detail-status .del{margin-left:auto;color:#c0392b;font-size:.85rem;cursor:pointer;}
  .arc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;}
  .arc-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
  .arc-card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #0000001a;}
  .arc-thumb{height:140px;background:#eef3ea center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;}
  .arc-body{padding:14px 16px;display:flex;flex-direction:column;gap:5px;}
  .arc-cat{font-size:.72rem;color:var(--green-m);font-weight:700;}
  .arc-title{font-weight:700;font-size:1.1rem;color:var(--ink);}
  .arc-sum{color:#555;font-size:.88rem;line-height:1.4;}
  .arc-res{color:var(--green-d);font-size:.85rem;font-weight:600;}
  .arc-foot{display:flex;align-items:center;margin-top:4px;}
  .arc-contrib{margin-left:auto;background:#bfe6a0;color:#1f5d24;border-radius:8px;padding:3px 9px;font-size:.78rem;font-weight:700;}
  .arc-new{border:2px dashed var(--green-d);background:var(--green-soft);color:var(--green-d);align-items:center;justify-content:center;font-weight:700;min-height:210px;text-align:center;line-height:1.7;}

  .editor{display:flex;gap:22px;align-items:flex-start;}
  .ed-preview{width:320px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:80vh;background:#fff;border:1.5px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .ed-preview img{max-width:100%;max-height:100%;object-fit:contain;}
  .ed-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
  .ed-side{width:280px;flex-shrink:0;background:#e2f1d8;border-radius:18px;padding:20px;align-self:flex-start;}
  .ed-row{display:flex;gap:12px;}
  .ed-field{display:flex;flex-direction:column;gap:6px;flex:1;}
  .ed-field label{font-weight:700;font-size:.9rem;color:var(--ink);}
  .ed-field input,.ed-field textarea,.ed-field select{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.98rem;width:100%;font-family:inherit;}
  .ed-field textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .imgbox{border:2px dashed var(--line);border-radius:14px;background:#fff;min-height:200px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
  .imgbox img{height:120px;border-radius:10px;object-fit:cover;}
  .img-wrap{position:relative;}
  .img-wrap b{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer;}
  .img-wrap img{cursor:pointer;border:2px solid transparent;}
  .img-wrap.sel img{border-color:var(--green-m);}
  .story-toggle{align-self:flex-start;border:1.5px solid var(--green-d);color:var(--green-d);border-radius:12px;padding:11px 18px;font-weight:700;}
  .story-box{display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 5px #00000012;}
  .story-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .ed-side h4{color:var(--ink);margin:18px 0 9px;font-size:.95rem;}
  .req{color:#e8645a;font-size:.85rem;font-weight:800;}
  .ed-side h4:first-child{margin-top:0;}
  .contrib-row{display:flex;gap:8px;}
  .contrib-row .opt{flex:1;text-align:center;border:1.5px solid var(--green-d);border-radius:10px;padding:9px;font-weight:700;cursor:pointer;background:#fff;color:var(--green-d);}
  .contrib-row .opt.sel{background:var(--green-d);color:#fff;}
  .skill-toggles{display:flex;flex-wrap:wrap;gap:8px;}
  .skill-tg{border:1.5px solid var(--green-d);border-radius:10px;padding:8px 13px;font-size:.85rem;cursor:pointer;background:#fff;color:var(--green-d);font-weight:600;}
  .skill-tg.sel{background:var(--green-d);color:#fff;}
  .ed-actions{display:flex;gap:10px;margin-top:8px;}
  .ed-actions button{flex:1;border-radius:12px;padding:14px;font-weight:700;}
  .chan-check{display:flex;flex-direction:column;gap:6px;}
  .chan-check .opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;font-size:.88rem;}
  .chan-check .opt.sel{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .imgbox img{cursor:zoom-in;}
  .folder-thumb{height:140px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;background:#eef3ea;}
  .filebox{border:2px dashed var(--line);border-radius:14px;background:#fff;min-height:62px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer;color:var(--muted);}
  .file-chip{background:var(--green-card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;display:flex;gap:8px;align-items:center;color:var(--ink);cursor:pointer;}
  .file-chip b{color:var(--red);cursor:pointer;}
  .lightbox{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:400;cursor:zoom-out;animation:viewIn .2s ease;}
  .lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 12px 50px #000a;}
  .lb-close{position:fixed;top:18px;right:28px;color:#fff;font-size:2rem;cursor:pointer;line-height:1;}

  /* ---------- CHAT VIEW ---------- */
  .chat-layout{display:flex;height:100%;gap:0;}
  .chan-list{width:280px;flex-shrink:0;display:flex;flex-direction:column;padding:6px 14px 14px 26px;}
  .chan-scroll{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;}
  .chan{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font-weight:600;}
  .chan.active{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .chan .arrow{margin-left:auto;}
  .chan .lock{font-size:.8rem;opacity:.7;}
  .new-chan{padding:16px;text-align:right;font-weight:700;color:var(--green-d);cursor:pointer;}

  .chat-main{flex:1;display:flex;flex-direction:column;background:#d3ecc6;border-radius:18px;margin:6px 12px;overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:12px;padding:18px 24px;}
  .chat-head h2{font-size:1.5rem;color:var(--ink);}
  .chat-head .tool{font-size:1.2rem;color:var(--green-d);cursor:pointer;}
  .chat-head .right{margin-left:auto;display:flex;gap:14px;}
  .msgs{flex:1;overflow:auto;padding:6px 24px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:900px;align-self:center;}
  .msg{align-self:flex-start;max-width:78%;display:flex;flex-direction:column;align-items:flex-start;}
  .bubble{background:#eef7e8;border-radius:14px;padding:14px 18px;font-size:1rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px #0000000d;}
  .msg.reply .bubble{background:#dcefd0;border-left:4px solid var(--green-m);}
  .reply-ctx{font-size:.8rem;color:var(--muted);background:#ffffff77;border-radius:8px;padding:5px 10px;margin-bottom:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msg-meta{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:.78rem;color:var(--muted);}
  .msg-meta button{font-size:.78rem;color:var(--muted);}
  .msg-meta button:hover{color:var(--green-d);text-decoration:underline;}
  .msg-meta button.del-msg{color:#ec8d86;}
  .msg-meta button.del-msg:hover{color:#e8645a;}
  .empty-chat{margin:auto;color:var(--muted);text-align:center;line-height:1.7;}
  .composer{display:block;width:100%;max-width:900px;align-self:center;margin:8px 0 16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 1px 4px #00000014;}
  .composer-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .composer-row .hint{color:var(--muted);font-size:.85rem;}
  .composer-row .send{margin-left:auto;}
  .replying-bar{display:flex;align-items:center;gap:8px;background:#ffffffaa;width:100%;max-width:900px;align-self:center;margin:0 0 6px;border-radius:10px;padding:8px 14px;font-size:.85rem;color:var(--muted);}
  .replying-bar button{margin-left:auto;color:var(--red);font-weight:700;}
  .composer textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.08rem;font-family:inherit;resize:none;line-height:1.5;min-height:60px;max-height:160px;overflow-y:auto;}
  .composer .send{background:var(--green-d);color:#fff;border-radius:12px;padding:11px 26px;font-weight:700;font-size:1.02rem;}

  .chat-side{width:280px;flex-shrink:0;background:#e2f1d8;border-radius:18px;margin:6px 18px 6px 0;padding:20px;overflow:auto;}
  .chat-side h3{color:var(--green-d);margin-bottom:14px;}
  .rel-proj{display:flex;align-items:center;background:#cfe7c0;border-radius:14px;padding:14px 16px;margin-bottom:12px;font-weight:600;cursor:pointer;}
  .rel-proj .arrow{margin-left:auto;}
  .rel-add{border:1.5px dashed var(--green-d);color:var(--green-d);border-radius:14px;padding:13px;text-align:center;font-weight:700;cursor:pointer;}

  /* ---------- MODAL / TOAST ---------- */
  .overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100;animation:ovIn .22s ease;}
  @keyframes ovIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:#fff;border-radius:18px;padding:26px;width:420px;max-width:90vw;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:modalIn .34s cubic-bezier(.34,1.4,.5,1);}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:none;}}
  .modal h3{color:var(--ink);font-size:1.25rem;}
  .modal input,.modal textarea,.modal select{background:#f4f8f0;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:1rem;width:100%;}
  .modal .row{display:flex;gap:10px;}
  .modal .opt{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-weight:600;cursor:pointer;}
  .modal .opt.sel{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .modal .actions{display:flex;gap:10px;margin-top:6px;}
  .modal .actions button{flex:1;border-radius:12px;padding:13px;font-weight:700;}
  .btn-primary{background:var(--green-m);color:#fff;}
  .btn-cancel{background:#eee;color:#555;}
  /* 설문식 마법사 */
  .wiz-top{display:flex;align-items:center;gap:12px;}
  .wiz-step{font-size:.82rem;font-weight:700;color:var(--green-d);white-space:nowrap;}
  .wiz-bar{flex:1;height:7px;border-radius:6px;background:#eef0ec;overflow:hidden;}
  .wiz-bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7ee37e,#23a14e);transition:width .35s cubic-bezier(.22,1,.36,1);}
  .wiz-help{color:var(--muted);font-size:.9rem;margin:-4px 0 2px;}
  .wiz-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .wiz-chip{border:1px solid var(--line);background:#f6f9f4;color:#3a5a3f;border-radius:20px;padding:7px 13px;font-size:.85rem;cursor:pointer;transition:all .15s;}
  .wiz-chip:hover{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .wiz-text{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.02rem;font-family:inherit;resize:vertical;min-height:120px;line-height:1.55;width:100%;}
  .wiz-chip.sel-date{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  /* 성과 입력 그리드 */
  .met-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .met-field{display:flex;flex-direction:column;gap:5px;}
  .met-field label{font-size:.85rem;font-weight:700;color:var(--ink);}
  .met-field input{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98rem;width:100%;font-family:inherit;}
  /* 캐릭터 꾸미기 */
  .title-badge{font-size:.82rem;color:var(--green-d);font-weight:700;background:#eef6ea;border:1px solid #dcecd4;border-radius:20px;padding:3px 12px;margin-top:6px;}
  .avatar{cursor:pointer;position:relative;transition:transform .15s;}
  .avatar:hover{transform:translateY(-2px);}
  .avatar-edit{position:absolute;right:10px;bottom:10px;background:var(--green-d);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;box-shadow:0 2px 6px #0003;}
  .cz-avs{display:flex;flex-wrap:wrap;gap:8px;}
  .cz-av{width:50px;height:50px;border-radius:12px;background:#f2f5ef;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;border:2px solid transparent;transition:all .15s;}
  .cz-av:hover{background:#e6efe1;}
  .cz-av.sel{border-color:var(--green-d);background:#eaf5e4;}
  .cz-av.locked{opacity:.55;cursor:default;font-size:1rem;flex-direction:column;gap:1px;}
  .cz-av.locked i{font-style:normal;font-size:.58rem;color:var(--muted);}
  .cz-preview{width:86px;height:86px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;margin:2px auto 6px;box-shadow:0 3px 12px #0000001f;}
  .cz-frames{display:flex;flex-wrap:wrap;gap:9px;}
  .cz-frame{width:46px;height:46px;border-radius:12px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 3px #0000001a;}
  .cz-frame.sel{border-color:var(--green-d);box-shadow:0 0 0 2px #fff inset,0 1px 3px #0000001a;}
  .cz-frame.locked{cursor:default;}
  .cz-frame.locked i{font-style:normal;font-size:.62rem;font-weight:700;color:#444;background:rgba(255,255,255,.78);padding:1px 5px;border-radius:6px;}
  .cz-titles{display:flex;flex-direction:column;gap:7px;}
  .cz-title{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:600;}
  .cz-title.sel{background:var(--green-d);color:#fff;border-color:var(--green-d);}
  .cz-title.locked{opacity:.5;cursor:default;}
  .lvunlock{margin-top:8px;font-size:.85rem;color:var(--green-m);font-weight:700;}
  /* 설명 배너 (쉬운 안내) */
  .guide{display:flex;gap:8px;align-items:flex-start;background:#f1f7ee;border:1px solid #e0eed9;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#3f5a44;font-size:.88rem;line-height:1.55;}
  .guide .g-ico{flex:0 0 auto;}
  /* 백업/용량 */
  .store-bar{height:10px;border-radius:6px;background:#eef0ec;overflow:hidden;}
  .store-bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7ee37e,#23a14e);transition:width .3s;}
  .store-bar.warn>i{background:linear-gradient(90deg,#f59e0b,#e8645a);}
  .backup-btns{display:flex;gap:8px;}
  .backup-btns button{flex:1;border-radius:12px;padding:11px;font-weight:700;}

  /* ---------- 성과 대시보드 ---------- */
  .dash{height:100%;overflow:auto;padding:8px 40px 40px;max-width:1080px;margin:0 auto;}
  .dash-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .power-card{flex:1 1 320px;background:linear-gradient(135deg,#1f7a3a,#23a14e);color:#fff;border-radius:18px;padding:24px 28px;box-shadow:0 8px 26px rgba(31,122,58,.32);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .power-card::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);}
  .power-label{font-size:.95rem;font-weight:700;opacity:.92;}
  .power-num{font-size:3.3rem;font-weight:900;line-height:1.05;margin:6px 0 5px;letter-spacing:-.02em;}
  .power-sub{font-size:.85rem;opacity:.92;}
  .radar-card{flex:1 1 300px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px 6px;box-shadow:0 2px 10px #0000000d;}
  .card-h{font-weight:700;color:var(--ink);margin-bottom:8px;}
  .radar-svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto;}
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-card{flex:1 1 0;min-width:88px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 1px 4px #00000010;}
  .stat-v{font-size:1.35rem;font-weight:800;color:var(--green-d);}
  .stat-l{font-size:.8rem;color:var(--muted);margin-top:2px;}
  .dash-block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d;}
  .imp-list{display:flex;flex-direction:column;gap:8px;}
  .imp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#f6f8f4;border-radius:10px;font-size:.95rem;}
  .imp-row b{font-weight:800;color:var(--green-d);}
  .color-pick{display:flex;gap:10px;flex-wrap:wrap;}
  .color-pick span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;}
  .color-pick span.sel{border-color:#1f5d24;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green-d);color:#fff;padding:14px 26px;border-radius:30px;font-weight:700;box-shadow:0 6px 20px #0004;z-index:200;animation:pop .3s;}
  .toast.xp{background:linear-gradient(90deg,#2e7d32,#56b94a);}
  @keyframes pop{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  .levelup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300;pointer-events:none;}
  .levelup .card{position:relative;background:#fff;border:3px solid #3ec43e;border-radius:24px;padding:38px 64px;text-align:center;box-shadow:0 14px 50px rgba(31,122,58,.35);animation:lvcard .55s cubic-bezier(.34,1.6,.45,1) both, lvglow 1.1s ease-in-out infinite alternate;}
  .levelup .card .lvlabel{font-size:1.05rem;font-weight:800;letter-spacing:.18em;color:#3ec43e;}
  .levelup .card .big{font-size:3.2rem;font-weight:900;background:linear-gradient(90deg,#1f9e44,#3ec43e);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0;}
  .levelup .card .lvsub{color:var(--green-m);font-weight:700;}
  @keyframes lvcard{0%{opacity:0;transform:scale(.5) rotate(-7deg);}60%{transform:scale(1.1) rotate(2deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes lvglow{from{box-shadow:0 14px 50px rgba(31,122,58,.3);}to{box-shadow:0 14px 64px rgba(62,196,62,.6);}}
  .lvflash{position:absolute;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(62,196,62,.55),transparent 70%);animation:lvflash .9s ease-out forwards;}
  @keyframes lvflash{0%{transform:scale(1);opacity:.85;}100%{transform:scale(26);opacity:0;}}
  .lvring{position:absolute;width:120px;height:120px;border-radius:50%;border:4px solid #3ec43e;animation:lvring .8s ease-out forwards;}
  @keyframes lvring{0%{transform:scale(.4);opacity:.8;}100%{transform:scale(3.2);opacity:0;}}
  .copyright{position:fixed;right:16px;bottom:8px;color:#1f5d2466;font-size:.85rem;}

  /* ---------- 게임화 UI (스트릭·업적) ---------- */
  .streak{align-self:stretch;background:#fff4e6;color:#c2410c;border:1px solid #ffe0b8;border-radius:12px;padding:9px 12px;font-size:.9rem;text-align:center;margin:14px 0 4px;}
  .streak b{font-size:1.05rem;}
  .side-head{align-self:stretch;display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;}
  .side-head .skills-title{margin:0;}
  .ach-more{color:var(--green-d);font-size:.82rem;font-weight:700;cursor:pointer;}
  .ach-shelf{align-self:stretch;display:flex;flex-wrap:wrap;gap:7px;}
  .ach-badge{width:34px;height:34px;border-radius:10px;background:#f1f5ee;display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:default;}
  .ach-row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:#f6f8f4;}
  .ach-row.locked{opacity:.45;}
  .ach-row .ach-ico{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:0 0 38px;}
  .ach-row .ach-n{font-weight:700;color:var(--ink);}
  .ach-row .ach-d{font-size:.82rem;color:var(--muted);}
  .ach-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--green-m);border-radius:16px;padding:12px 20px 12px 14px;box-shadow:0 10px 30px rgba(31,122,58,.25);z-index:360;animation:achin .4s cubic-bezier(.34,1.5,.5,1);}
  .ach-toast .ach-ico{font-size:1.8rem;}
  .ach-toast .ach-t{font-size:.72rem;font-weight:800;color:var(--green-m);letter-spacing:.08em;}
  .ach-toast .ach-n{font-weight:800;color:var(--ink);font-size:1.05rem;}
  @keyframes achin{from{opacity:0;transform:translate(-50%,-16px) scale(.9);}to{opacity:1;transform:translate(-50%,0) scale(1);}}

  /* ---------- ANIMATIONS / MICRO-INTERACTIONS ---------- */
  button{transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .25s ease, color .2s ease, border-color .2s ease, opacity .2s ease;}
  button:active{transform:scale(.94);transition:transform .07s ease-out;}
  .proj-card,.arc-card,.chan,.rel-proj,.o-card,.tl-item,.ws-card{transition:transform .32s cubic-bezier(.22,1,.36,1), box-shadow .32s ease, background .25s ease;}
  .nav-btn,.pill,.opt,.skill-tg,.skill,.contrib-row .opt,.story-toggle,.chan-check .opt,.detail-status .opt,.ws-item,.ws-label,.tl-act{transition:all .25s cubic-bezier(.22,1,.36,1);}
  .ed-field input,.ed-field textarea,.ed-field select,.composer textarea,.modal input,.modal textarea,.search-wrap input,.login-box input,.metric-row input{transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;}
  .ed-field input:focus,.ed-field textarea:focus,.ed-field select:focus,.composer textarea:focus,.modal input:focus,.modal textarea:focus,.search-wrap input:focus,.login-box input:focus,.metric-row input:focus{border-color:var(--green-m);box-shadow:0 0 0 3px rgba(46,125,50,.13);}

  @keyframes viewIn{from{opacity:0;}to{opacity:1;}}
  .proj-layout,.detail,.chat-layout{animation:viewIn .26s ease both;}

  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:none;}}
  .proj-grid .proj-card,.arc-grid .arc-card,.chan-scroll .chan{animation:cardIn .46s cubic-bezier(.22,1,.36,1) both;}
  .arc-grid .arc-card:nth-child(2){animation-delay:.04s}
  .arc-grid .arc-card:nth-child(3){animation-delay:.08s}
  .arc-grid .arc-card:nth-child(4){animation-delay:.12s}
  .arc-grid .arc-card:nth-child(5){animation-delay:.16s}
  .arc-grid .arc-card:nth-child(6){animation-delay:.20s}
  .arc-grid .arc-card:nth-child(7){animation-delay:.24s}
  .proj-grid .proj-card:nth-child(2){animation-delay:.04s}
  .proj-grid .proj-card:nth-child(3){animation-delay:.08s}
  .proj-grid .proj-card:nth-child(4){animation-delay:.12s}
  .proj-grid .proj-card:nth-child(5){animation-delay:.16s}
  .proj-grid .proj-card:nth-child(6){animation-delay:.20s}

  @keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
  .msgs .msg:first-child{animation:msgIn .32s cubic-bezier(.2,.9,.3,1.2) both;}

  /* ripple */
  .nav-btn,.pill,.send,.btn-primary,.btn-cancel,.add-archive,.opt,.skill-tg,.story-toggle,.new-chan,.rel-add,.arc-new,.proj-card.new,.contrib-row .opt{position:relative;overflow:hidden;}
  .rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rpx .85s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none;}
  @keyframes rpx{to{transform:scale(2.7);opacity:0;}}

  /* ---------- 버튼 호버 역동 모션 (lift + shine + glow) ---------- */
  .nav-btn,.pill,.btn-primary,.add-archive,.send{position:relative;overflow:hidden;}
  .nav-btn::after,.pill::after,.btn-primary::after,.add-archive::after,.send::after{
    content:"";position:absolute;top:0;bottom:0;left:-135%;width:55%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
    transform:skewX(-20deg);transition:left .6s cubic-bezier(.22,1,.36,1);pointer-events:none;}
  .nav-btn::after,.pill.ghost::after{background:linear-gradient(120deg,transparent,rgba(46,125,50,.18),transparent);}
  .nav-btn:hover::after,.pill:hover::after,.btn-primary:hover::after,.add-archive:hover::after,.send:hover::after{left:155%;}
  .nav-btn:hover,.pill:hover,.btn-primary:hover,.add-archive:hover,.send:hover{transform:translateY(-2px) scale(1.04);}
  .nav-btn:hover{box-shadow:0 8px 18px rgba(31,93,36,.18);border-color:var(--green-m);}
  .pill.ghost:hover{box-shadow:0 8px 18px rgba(31,93,36,.16);}
  .pill.red:hover{box-shadow:0 9px 22px rgba(232,100,90,.4);}
  .btn-primary:hover,.add-archive:hover,.send:hover{box-shadow:0 9px 22px rgba(46,125,50,.34);}
  .nav-btn:active,.pill:active,.btn-primary:active,.add-archive:active,.send:active{transform:translateY(0) scale(.95);transition:transform .07s ease-out;}

  /* confetti + xp float */
  .confetti{position:fixed;top:24%;width:10px;height:14px;border-radius:2px;z-index:350;pointer-events:none;animation:conf 1.6s cubic-bezier(.2,.7,.4,1) forwards;}
  @keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}
  .spark{position:fixed;width:9px;height:9px;border-radius:50%;z-index:345;pointer-events:none;box-shadow:0 0 8px currentColor;animation:sparkfly .7s ease-out forwards;}
  @keyframes sparkfly{0%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}100%{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(0);opacity:0;}}
  .xpfloat{position:fixed;top:15%;left:50%;font-size:2.1rem;font-weight:900;z-index:340;pointer-events:none;background:linear-gradient(90deg,#1f9e44,#3ec43e,#9bf08a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(40,180,70,.45));animation:xpf 1.25s cubic-bezier(.2,.9,.3,1.2) forwards;}
  @keyframes xpf{0%{opacity:0;transform:translate(-50%,16px) scale(.4);}18%{opacity:1;transform:translate(-50%,-4px) scale(1.35);}34%{transform:translate(-50%,-8px) scale(1);}100%{opacity:0;transform:translate(-50%,-70px) scale(1.02);}}
  /* 콤보 팝업 */
  .combo-pop{position:fixed;top:26%;left:50%;z-index:346;pointer-events:none;display:flex;flex-direction:column;align-items:center;line-height:1;animation:comboPop .95s cubic-bezier(.2,1.4,.4,1) forwards;text-shadow:0 3px 12px rgba(0,0,0,.18);}
  .combo-pop .combo-n{font-size:4rem;font-weight:900;color:hsl(var(--ch),85%,48%);letter-spacing:-.02em;}
  .combo-pop .combo-x{font-size:1.6rem;font-weight:900;color:hsl(var(--ch),85%,42%);letter-spacing:.06em;margin-top:-6px;}
  .combo-pop .combo-b{font-size:.95rem;font-weight:800;color:#2e7d32;margin-top:8px;background:#fff;border-radius:20px;padding:3px 12px;box-shadow:0 2px 8px #0002;}
  @keyframes comboPop{0%{opacity:0;transform:translate(-50%,10px) scale(.5) rotate(-6deg);}25%{opacity:1;transform:translate(-50%,0) scale(1.2) rotate(3deg);}45%{transform:translate(-50%,0) scale(1) rotate(0);}80%{opacity:1;transform:translate(-50%,-6px) scale(1);}100%{opacity:0;transform:translate(-50%,-34px) scale(.96);}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

  /* ---------- 로고 ---------- */
  .brand svg{display:block;width:auto;}
  .brand-login svg{height:54px;}
  .brand-top svg{height:32px;}

  /* ---------- 움직이는 그라데이션 배경 ---------- */
  .bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(95px);opacity:.13;will-change:transform;}
  .blob.b1{width:46vw;height:46vw;background:radial-gradient(circle at 32% 30%,#dff5c4,#a7e08a);top:-12vw;left:-8vw;animation:float1 17.1s ease-in-out infinite;}
  .blob.b2{width:40vw;height:40vw;background:radial-gradient(circle at 32% 30%,#e4f7d2,#a9dcc0);bottom:-14vw;right:-6vw;animation:float2 21.6s ease-in-out infinite;}
  .blob.b3{width:34vw;height:34vw;background:radial-gradient(circle at 32% 30%,#f4f8d6,#cdebab);top:38%;left:52%;animation:float3 24.3s ease-in-out infinite;}
  .blob.b4{width:28vw;height:28vw;background:radial-gradient(circle at 32% 30%,#dcf3e6,#abdcca);top:8%;right:24%;animation:float1 27.9s ease-in-out infinite reverse;}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6vw,5vw) scale(1.12);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-6vw,-4vw) scale(1.1);}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-5vw,4vw) scale(1.15);}}

  /* ---------- CLEAN CARDS (Toss-style · 솔리드 + 명확한 대비) ---------- */
  .nav-btn,.pill.ghost{background:#fff;box-shadow:0 1px 2px #0000000d;}
  .search-wrap input{background:#fff;box-shadow:0 1px 3px #00000012;}
  .login-box input{background:#fff;box-shadow:0 1px 5px #00000014;}
  .proj-card{background:#fff;box-shadow:0 1px 3px #00000016;}
  .proj-card.new,.arc-new{background:#eef3ea;box-shadow:none;}
  .arc-card{background:#fff;box-shadow:0 1px 3px #00000016;}
  .side,.ed-side,.chat-side{background:#fff;box-shadow:0 1px 4px #00000014;}
  .chat-main{background:#fff;box-shadow:0 1px 4px #00000014;}
  .chan{background:#fff;box-shadow:0 1px 2px #00000010;}
  .bubble{background:#eef2ec;box-shadow:none;}
  .msg.reply .bubble{background:#e6f1e1;}
  .composer textarea{background:#fff;}
  .imgbox,.filebox,.ed-preview{background:#fff;}
  .modal{background:#fff;}
  .search-results{background:#fff;}
  .avatar{background:#eef2ec;}
  .rel-proj{background:#eef4ea;}
  .folder-thumb,.arc-thumb{background-color:#eef2ec;}

  /* ---------- 워크스페이스 선택 ---------- */
  .ws-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:40px;max-width:760px;}
  .ws-card{width:220px;height:150px;background:#fff;box-shadow:0 1px 4px #00000016;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;font-weight:600;font-size:1.15rem;color:var(--ink);}
  .ws-card:hover{transform:translateY(-4px);box-shadow:0 10px 26px #0001;}
  .ws-card .ws-emoji{font-size:2.4rem;}
  .ws-card .ws-lv{font-size:.82rem;font-weight:500;color:var(--muted);}
  .ws-card.new{border-style:dashed;background:rgba(214,236,202,.4);color:var(--green-d);}

  /* ---------- 워크스페이스 전환 드롭다운 ---------- */
  .ws-switch{position:relative;}
  .ws-label{display:flex;align-items:center;gap:6px;background:#fff;box-shadow:0 1px 2px #0000000a;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .ws-switch .ws-caret{font-size:.8rem;opacity:.7;}
  .ws-menu{position:absolute;top:52px;left:0;min-width:230px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #0002;padding:6px;z-index:60;}
  .ws-item{padding:11px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.95rem;}
  .ws-item:hover{background:var(--green-card);}
  .ws-item.cur{color:var(--green-d);}
  .ws-item.del{color:#c0392b;}
  .ws-sep{height:1px;background:var(--line);margin:5px 2px;}

  /* ---------- 성과 지표 ---------- */
  .metric-box{background:#fff;box-shadow:0 1px 4px #00000014;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
  .metric-box input[type=number],.metric-box input[type=date]{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.98rem;width:100%;font-family:inherit;}
  .chart-wrap{background:rgba(255,255,255,.5);border-radius:12px;padding:12px;}
  .chart-svg{width:100%;height:auto;display:block;}
  .metric-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .metric-row input{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;font-family:inherit;}
  .metric-row input[type=date]{flex:0 0 158px;}
  .metric-row input[list]{flex:1;min-width:0;}
  .metric-row input[type=number]{flex:0 0 120px;}
  .metric-row button{flex:0 0 34px;height:34px;color:var(--red);font-weight:700;border-radius:8px;}
  .metric-row button:hover{background:#fbe3e1;}

  /* ---------- 포트폴리오 빌더 ---------- */
  .pf-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:#fff;}
  .pf-pick{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .pf-pick:hover{background:var(--green-card);}
  .pf-pick input[type=checkbox]{width:18px;height:18px;flex:0 0 18px;padding:0;margin:2px 0 0;}
  .pf-pick-txt{display:flex;flex-direction:column;gap:2px;}
  .pf-pick-txt small{color:var(--muted);}

  /* ---------- 포트폴리오 문서 / 인쇄 ---------- */
  #portfolioPrint{position:fixed;inset:0;z-index:500;background:#e9eee4;overflow:auto;}
  .pf-toolbar{position:sticky;top:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid #ccc;}
  .pf-toolbar button{border-radius:12px;padding:11px 22px;font-weight:700;}
  .pf-page{max-width:900px;margin:24px auto;background:#fff;color:#1f2d20;padding:54px 56px;box-shadow:0 6px 30px #0002;border-radius:4px;}
  .pf-top{margin-bottom:26px;}
  .pf-name{font-size:2rem;font-weight:800;color:#143d18;}
  .pf-headline{font-size:1.05rem;color:#4a5d4a;margin-top:6px;}
  .pf-top-skills{margin-top:14px;}
  .pf-divider{height:2px;background:#143d18;margin:18px 0 10px;}
  .pf-doctitle{font-size:.95rem;color:#6a7d6a;letter-spacing:.04em;text-transform:uppercase;font-weight:700;}
  .pf-block{padding:22px 0;border-bottom:1px solid #e3e8e0;page-break-inside:avoid;break-inside:avoid;}
  .pf-bhead h2{font-size:1.3rem;color:#143d18;}
  .pf-tags{font-size:.85rem;color:#6a7d6a;margin-top:3px;}
  .pf-meta{font-size:.8rem;color:#9aa89a;margin:2px 0 8px;}
  .pf-summary{font-size:1rem;color:#334033;margin:6px 0;line-height:1.55;}
  .pf-result{background:#eef7e8;border-left:4px solid #2e7d32;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem;color:#1f4d22;}
  .pf-result b{font-weight:700;}
  .pf-metrics{margin:10px 0;}
  .pf-charts{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
  .pf-chart{flex:1 1 320px;min-width:280px;}
  .pf-chart-cap{font-size:.82rem;font-weight:700;color:#2e5d32;margin-bottom:4px;}
  .pf-chart .chart-svg{background:#f6f8f3;border:1px solid #e3e8e0;border-radius:8px;}
  .pf-imgs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
  .pf-img-box{flex:0 0 calc(50% - 5px);aspect-ratio:4/3;background:#f0f0f0;border:1px solid #e3e8e0;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pf-img-box img{max-width:100%;max-height:100%;object-fit:contain;}
  .pf-srow{display:flex;gap:14px;margin:8px 0;}
  .pf-slabel{flex:0 0 130px;font-weight:700;color:#2e5d32;font-size:.9rem;}
  .pf-stext{flex:1;font-size:.95rem;color:#3a473a;line-height:1.55;white-space:pre-wrap;}
  .pf-skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pf-skills span{background:#e7f3df;color:#1f5d24;border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:600;}
  .pf-link{font-size:.85rem;color:#2e7d32;margin-top:4px;word-break:break-all;}
  .pf-foot{margin-top:24px;text-align:center;color:#9aa89a;font-size:.8rem;}

  /* ---------- 홈 (빠른 기록 + 타임라인) ---------- */
  .home{height:100%;overflow:auto;padding:8px 40px 40px;max-width:1100px;margin:0 auto;}
  .capture{background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:22px;}
  .capture textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.08rem;font-family:inherit;resize:none;min-height:60px;max-height:160px;line-height:1.5;}
  .capture-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .capture-row .hint{color:var(--muted);font-size:.85rem;}
  .capture-row .send{margin-left:auto;background:var(--green-d);color:#fff;border-radius:12px;padding:11px 26px;font-weight:700;}
  .home-cols{display:flex;gap:22px;align-items:flex-start;}
  .timeline{flex:1;min-width:0;}
  .tl-day{font-weight:700;color:var(--muted);font-size:.85rem;margin:4px 0 10px;}
  .tl-item{display:flex;gap:12px;background:rgba(255,255,255,.46);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:9px;transition:transform .12s,box-shadow .12s;}
  .tl-item:hover{box-shadow:0 4px 14px #0001;}
  .tl-ico{font-size:1.2rem;flex:0 0 auto;}
  .tl-body{flex:1;min-width:0;}
  .tl-text{font-size:.98rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--ink);}
  .tl-meta{display:flex;gap:9px;align-items:center;margin-top:6px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;}
  .tl-tag{background:var(--green-card);color:var(--green-d);border-radius:6px;padding:2px 8px;font-weight:600;}
  .tl-act{cursor:pointer;color:var(--muted);}
  .tl-act:hover{color:var(--green-d);text-decoration:underline;}
  .home-side{width:300px;flex-shrink:0;background:rgba(226,241,216,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:20px;}
  .home-side h3{color:var(--green-d);margin-bottom:12px;font-size:1.05rem;}
  .ongoing{display:flex;flex-direction:column;gap:10px;}
  .o-card{background:rgba(255,255,255,.5);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;}
  .o-card:hover{background:#fff;}
  .o-name{font-weight:700;color:var(--ink);}
  .o-meta{font-size:.78rem;color:var(--muted);margin-top:3px;}
  .tl-empty{color:var(--muted);text-align:center;padding:34px;line-height:1.7;}

  /* ---------- 캘린더 홈 (Toss-style 심플) ---------- */
  .cal-head{display:flex;align-items:center;gap:8px;margin:10px 0 20px;}
  .cal-head h2{font-size:1.3rem;font-weight:600;color:var(--ink);min-width:132px;text-align:center;letter-spacing:-.01em;}
  .cal-nav{font-size:1.6rem;color:#a7b1a4;padding:0 10px;border-radius:10px;line-height:1.2;font-weight:400;}
  .cal-nav:hover{background:#f1f4ef;color:var(--green-d);}
  .cal-today{border:1px solid var(--line);color:#666;border-radius:12px;padding:8px 18px;font-weight:500;background:#fff;}
  .cal-today:hover{border-color:var(--green-m);color:var(--green-d);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:500;color:#aab4a8;font-size:.84rem;padding:2px 0 10px;}
  .cal-weekdays .sun{color:#e08a8a;}
  .cal-weekdays .sat{color:#8aa3e0;}
  .cal-body{border:1px solid #eef0ec;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 1px 5px #00000014;}
  .cal-week{position:relative;border-bottom:1px solid #f1f3ef;}
  .cal-week:last-child{border-bottom:none;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{min-height:120px;padding:12px 11px 6px;border-right:1px solid #f1f3ef;}
  .cal-cell:last-child{border-right:none;}
  .cal-cell.empty{background:rgba(0,0,0,.012);}
  .cal-cell-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .cal-dnum{font-size:1rem;font-weight:500;color:#5c625a;line-height:1;min-width:24px;}
  .cal-cell.today .cal-dnum{background:var(--green-m);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.92rem;}
  .cal-badges{display:flex;flex-wrap:wrap;gap:5px;}
  .cal-badge{min-width:22px;height:22px;border-radius:50%;color:#fff;font-size:.74rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;cursor:pointer;transition:transform .15s;}
  .cal-badge:hover{transform:scale(1.15);}
  .cal-bars{position:relative;margin:6px 4px 0;}
  .cal-bar{position:absolute;height:20px;border-radius:10px;color:#fff;font-size:.72rem;font-weight:500;line-height:20px;padding:0 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:filter .15s;}
  .cal-bar:hover{filter:brightness(1.06);}
  .cal-legend{color:#9aa89a;font-size:.82rem;margin-top:14px;line-height:1.5;font-weight:400;}

  @media print{
    body{padding:0!important;}
    body > *:not(#portfolioPrint){display:none!important;}
    #portfolioPrint{position:static;background:#fff;overflow:visible;}
    .pf-toolbar{display:none!important;}
    .pf-page{box-shadow:none;margin:0;max-width:100%;padding:0;border-radius:0;}
    @page{size:A4;margin:14mm;}
  }
</style>
</head>

let DB = null;        // 전체 데이터
let view = 'proj';    // 현재 화면
let activeChannel = null;
let replyTarget = null;

/* ---------- 저장/로드 ---------- */
function cleanDBForSave(obj){
  return JSON.parse(JSON.stringify(obj));
}

/* ---------- firebase store 저장---------- */

let saveTimer = null;

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  }catch(e){
    console.warn('localStorage 저장 실패:', e);
  }

  clearTimeout(saveTimer);

  saveTimer = setTimeout(()=>{
    if(DB && DB.auth && DB.auth.id){
      firestore.collection("users").doc(DB.auth.id).set({
        data: cleanDBForSave(DB),
        updatedAt: new Date()
      }).then(()=>{
        console.log("☁️ Firestore 저장 완료");
      }).catch(e=>{
        console.error("Firestore 저장 실패:", e);
      });
    }
  }, 1500);
}

/* ---------- firebase store 저장 끝---------- */

  /* ---------- firebase 로그인 시 데이터 불러오기---------- */ 
function load(){
  try{ DB = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ DB=null; }
}

async function loadFromFirestore(id){
  try{
    const doc = await firestore.collection("users").doc(id).get();

    if(doc.exists && doc.data() && doc.data().data){
      DB = doc.data().data;
      localStorage.setItem(STORE_KEY, JSON.stringify(DB));
      console.log("☁️ Firestore 불러오기 성공");
      return true;
    }

    console.log("Firestore에 저장된 데이터 없음");
    return false;
  }catch(e){
    console.error("Firestore 불러오기 실패:", e);
    return false;
  }
}
 /* ---------- firebase 로그인 시 데이터 불러오기 ---------- */ 
  
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const DEFAULT_PRESETS=['광고소재','랜딩페이지','상세페이지','블로그/SEO','광고캠페인','GTM','성과분석'];
function newWorkspace(name){ return { id:uid(), name:name||'내 워크스페이스', xp:0, skills:['figma','excel','Ai','chatGPT','Claude'], folderPresets:[...DEFAULT_PRESETS], projects:[], channels:[] }; }

/* ---------- 로그인 ---------- */
async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value.trim();
  if(!id || !pw){ alert('아이디와 비밀번호를 입력하세요.'); return; }

  await loadFromFirestore(id);

  if(!DB){
    load();
  }

  if(!DB){
    const ws=newWorkspace('내 워크스페이스');
    DB = { auth:{ id, pw }, user:{ name:id }, workspaces:[ws], currentWorkspaceId:ws.id, loggedIn:true };
    ensureWorkspaces(); bindWorkspace(ws.id); save();
    showWorkspaceSelect();
    return;
  }

  if(DB.auth.id!==id || DB.auth.pw!==pw){
    alert('아이디 또는 비밀번호가 일치하지 않습니다.');
    return;
  }

  DB.loggedIn = true;
  ensureWorkspaces();
  bindWorkspace();
  save();
  showWorkspaceSelect();
}

  
function logout(){
  if(DB) DB.loggedIn = false;

  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  }catch(e){
    console.warn('로그아웃 localStorage 저장 실패:', e);
  }

  location.reload();
}

/* ---------- 워크스페이스 ---------- */
function ensureWorkspaces(){
  if(!DB.workspaces || !DB.workspaces.length){
    // 구버전(단일 공간) 데이터 → '내 워크스페이스'로 이전
    const ws={ id:uid(), name:'내 워크스페이스',
      xp:(DB.user&&DB.user.xp)||0,
      skills:(DB.user&&DB.user.skills)||['figma','excel','Ai','chatGPT','Claude'],
      folderPresets:DB.folderPresets||[...DEFAULT_PRESETS],
      projects:DB.projects||[], channels:DB.channels||[] };
    DB.workspaces=[ws]; DB.currentWorkspaceId=ws.id;
  }
  DB.user={ name:(DB.user&&DB.user.name)||(DB.auth&&DB.auth.id)||'me' };
  delete DB.projects; delete DB.channels; delete DB.folderPresets;
  DB.workspaces.forEach(w=>{ if(!w.folderPresets)w.folderPresets=[...DEFAULT_PRESETS]; if(!w.skills)w.skills=[]; if(w.xp==null)w.xp=0; });
  if(!DB.currentWorkspaceId || !DB.workspaces.find(w=>w.id===DB.currentWorkspaceId)) DB.currentWorkspaceId=DB.workspaces[0].id;
  // 계정 단위(글로벌) 게임화 상태 — XP/레벨은 '나' 캐릭터 1명 기준
  if(!DB.account){
    const sumXp=DB.workspaces.reduce((s,w)=>s+(w.xp||0),0);
    DB.account={ xp:sumXp, streak:{count:0,last:'',freeze:1}, achievements:[], qualityCount:0, portfolioMade:false };
  }
  DB.account.streak=DB.account.streak||{count:0,last:'',freeze:1};
  if(DB.account.streak.freeze==null)DB.account.streak.freeze=1;
  DB.account.achievements=DB.account.achievements||[];
  if(DB.account.qualityCount==null)DB.account.qualityCount=0;
  if(!DB.account.avatar)DB.account.avatar='🧑‍🚀';
  if(DB.account.title==null)DB.account.title='기록 새싹';
  if(!DB.account.frame)DB.account.frame='basic';
  if(DB.account.soundOn==null)DB.account.soundOn=true;
}
function WS(){ return DB.workspaces.find(w=>w.id===DB.currentWorkspaceId) || DB.workspaces[0]; }
/* 현재 워크스페이스의 데이터를 DB.projects/channels/folderPresets, DB.user.xp/skills 로 노출(비열거 getter) */
function bindWorkspace(id){
  if(id) DB.currentWorkspaceId=id;
  const ws=WS(); DB.currentWorkspaceId=ws.id;
  const alias=(obj,key,target,tkey)=>Object.defineProperty(obj,key,{configurable:true,enumerable:false,get:()=>target[tkey],set:v=>{target[tkey]=v;}});
  alias(DB,'projects',ws,'projects');
  alias(DB,'channels',ws,'channels');
  alias(DB,'folderPresets',ws,'folderPresets');
  alias(DB.user,'xp',DB.account,'xp');   /* XP는 계정 글로벌 */
  alias(DB.user,'skills',ws,'skills');
}
function ensureDefaults(){ if(!DB.folderPresets) DB.folderPresets=[...DEFAULT_PRESETS]; }

function showWorkspaceSelect(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='none';
  document.getElementById('wsSelect').style.display='flex';
  renderWsGrid();
}
function renderWsGrid(){
  const grid=document.getElementById('wsGrid');
  const cards=DB.workspaces.map(w=>{
    const arcs=(w.projects||[]).reduce((s,p)=>s+(p.folders||[]).reduce((t,f)=>t+(f.archives||[]).length,0),0);
    return `<div class="ws-card" onclick="chooseWorkspace('${w.id}')"><div class="ws-emoji">🗂️</div><div>${esc(w.name)}</div><div class="ws-lv">프로젝트 ${(w.projects||[]).length} · 완성본 ${arcs}</div></div>`;
  }).join('');
  grid.innerHTML=cards+`<div class="ws-card new" onclick="createWorkspace()"><div class="ws-emoji">＋</div><div>새 워크스페이스</div></div>`;
}
function chooseWorkspace(id){
  bindWorkspace(id); save();
  document.getElementById('wsSelect').style.display='none';
  enterMain();
}
function enterMain(){
  ensureDefaults();
  activeChannel=null; currentProjectId=null; currentFolderId=null;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('wsSelect').style.display='none';
  document.getElementById('app').style.display='flex';
  renderWsSwitch();
  go('home');
}
function switchWorkspace(id){ closeWsMenu(); bindWorkspace(id); save(); enterMain(); }
function createWorkspace(){
  closeWsMenu();
  modal(`<h3>새 워크스페이스</h3>
    <input id="wsNewName" placeholder="이름 (예: 달빛상회, 개인, 외주)">
    <div class="actions"><button class="btn-cancel" onclick="closeModal()">취소</button><button class="btn-primary" onclick="doCreateWorkspace()">만들기</button></div>`);
  setTimeout(()=>{ const e=document.getElementById('wsNewName'); if(e)e.focus(); },60);
}
function doCreateWorkspace(){
  const n=(document.getElementById('wsNewName').value||'').trim(); if(!n){ alert('이름을 입력하세요.'); return; }
  const ws=newWorkspace(n); DB.workspaces.push(ws); bindWorkspace(ws.id); save(); closeModal(); enterMain(); toast(`'${ws.name}' 워크스페이스 생성 🗂️`);
}

/* ---------- 레벨 계산 ---------- */
/* 레벨업: 기본 1000 XP, 레벨업마다 필요량 +5.5% */
function levelInfo(){
  let xp = DB.user.xp;
  let level = 1;
  let need = 1000;
  while(xp >= need){ xp -= need; level++; need = Math.round(need * 1.055); }
  return { level, into: xp, need, pct: Math.min(100, xp/need*100) };
}
function addXP(amount, projId){
  const before = levelInfo().level;
  DB.user.xp += amount;
  if(projId){
    const p = DB.projects.find(x=>x.id===projId);
    if(p) p.xp = (p.xp||0)+amount;
  }
  touchStreak();
  save();
  const after = levelInfo().level;
  xpFloat(amount);
  if(after>before) setTimeout(()=>levelUp(after), 400);
  checkAchievements();
}

/* ---------- 연속 기록 스트릭 ---------- */
function parseYMD(s){ const [a,b,c]=s.split('-').map(Number); return new Date(a,b-1,c); }
function touchStreak(){
  const st=DB.account.streak; const today=ymd(new Date());
  if(st.last===today) return;
  if(st.last){
    const diff=Math.round((parseYMD(today)-parseYMD(st.last))/86400000);
    if(diff===1) st.count++;
    else if(diff===2 && st.freeze>0){ st.freeze--; st.count++; setTimeout(()=>toast('🧊 스트릭 프리즈 사용 — 연속 유지!'),300); }
    else st.count=1;
  } else st.count=1;
  st.last=today;
  if(st.count>0 && st.count%7===0){ DB.user.xp += 50; setTimeout(()=>toast(`🔥 ${st.count}일 연속! 보너스 +50 XP`),500); }
}

/* ---------- 업적/배지 (계정 글로벌) ---------- */
/* 집계 도우미 (전 워크스페이스) */
function totalArchives(){ let n=0; DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>n+=(f.archives||[]).length))); return n; }
function anyProjectDone(){ return DB.workspaces.some(w=>(w.projects||[]).some(p=>p.status==='완료')); }
function countCompletedProjects(){ let n=0; DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>{ if(p.status==='완료')n++; })); return n; }
function countProjects(){ let n=0; DB.workspaces.forEach(w=>n+=(w.projects||[]).length); return n; }
function usedAllCategories(){ const set=new Set(); DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>set.add(a.category||'기타'))))); return ARC_CATEGORIES.every(c=>set.has(c)); }
function countMessages(){ let n=0; DB.workspaces.forEach(w=>(w.channels||[]).forEach(c=>n+=(c.messages||[]).length)); return n; }
function countChannels(){ let n=0; DB.workspaces.forEach(w=>n+=(w.channels||[]).length); return n; }
function countDistinctSkills(){ const s=new Set(); DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>(a.skills||[]).forEach(x=>s.add(x)))))); return s.size; }
function countMetricRows(){ let n=0; DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>n+=(a.metrics||[]).filter(r=>r.value!==''&&r.value!=null).length)))); return n; }
function countArchivesWithImages(){ let n=0; DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>{ if(a.images&&a.images.length)n++; })))); return n; }
function hasHourRecord(lo,hi){ let ok=false; DB.workspaces.forEach(w=>(w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>{ if(a.createdAt){ const h=new Date(a.createdAt).getHours(); if(h>=lo&&h<hi)ok=true; } })))); return ok; }
function hasAnyImprovement(){ let ok=false; DB.workspaces.forEach(w=>{ const rows=[]; (w.projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>(a.metrics||[]).forEach(r=>{ if(r.name&&r.value!==''&&r.value!=null&&!isNaN(Number(r.value))&&r.date)rows.push(r); })))); [...new Set(rows.map(r=>r.name))].forEach(n=>{ const ser=archiveSeries(rows,n,'day'); if(ser.length>=2 && ser[0].value!==ser[ser.length-1].value) ok=true; }); }); return ok; }

function checkAchievements(){
  const unlocked=[];
  ACHIEVEMENTS.forEach(a=>{ if(!DB.account.achievements.includes(a.id) && a.cond()){ DB.account.achievements.push(a.id); unlocked.push(a); } });
  if(unlocked.length){ save(); unlocked.forEach((a,i)=>setTimeout(()=>achievementToast(a),700+i*1000)); }
}
function achievementToast(a){
  const e=document.createElement('div'); e.className='ach-toast';
  e.innerHTML=`<div class="ach-ico">${a.icon}</div><div><div class="ach-t">업적 달성!</div><div class="ach-n">${esc(a.name)}</div></div>`;
  document.body.appendChild(e); playSound('ach'); confetti(50); setTimeout(()=>e.remove(),2800);
}

function storageInfo(){
  let bytes=0; const raw=localStorage.getItem(STORE_KEY)||'';
  try{ bytes=new Blob([raw]).size; }catch(e){ bytes=raw.length; }
  const mb=bytes/1048576; return { mb, pct:Math.min(100, mb/5*100) };
}
function exportBackup(){
  const data=JSON.stringify(DB);
  const blob=new Blob([data],{type:'application/json'});
  const d=new Date();
  const a=document.createElement('a');
  a.download=`lvuplog-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  a.href=URL.createObjectURL(blob); a.click();
  toast('백업 파일을 내보냈어요 💾');
}
function importBackup(input){
  const f=input.files[0]; if(!f){ return; }
  if(!confirm('지금 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')){ input.value=''; return; }
  const r=new FileReader();
  r.onload=e=>{
    try{
      const obj=JSON.parse(e.target.result);
      if(!obj || (!obj.workspaces && !obj.projects)){ alert('올바른 LVUP.log 백업 파일이 아니에요.'); input.value=''; return; }
      localStorage.setItem(STORE_KEY, JSON.stringify(obj));
      alert('복원 완료! 새로고침합니다.'); location.reload();

/* ======================= 홈 (당월 캘린더) ======================= */
let homeYM = (function(){ const n=new Date(); return {y:n.getFullYear(), m:n.getMonth()}; })();
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function periodLabel(a){ if(a.periodStart&&a.periodEnd) return `${a.periodStart} ~ ${a.periodEnd}`; if(a.periodStart) return a.periodStart; return a.period||'기간 미기재'; }
const CAT_PALETTE=['#2e7d32','#6fbf73','#4f9e57','#95cf86','#3f8f48','#7fc98a','#5cae74','#a7d99a'];
function catColor(cat){ let h=0; const s=cat||'기타'; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return CAT_PALETTE[h%CAT_PALETTE.length]; }
function calItems(){
  const pts={}, durs=[];
  (WS().projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>{
    const cat=a.category||'기타';
    const start=a.periodStart || ymd(new Date(a.createdAt||Date.now()));
    const end=a.periodEnd || start;
    const isDur = a.periodStart && a.periodEnd && a.periodEnd>a.periodStart;
    if(isDur){ durs.push({start,end,cat,title:`${p.name}>${cat}`,project:p,folder:f,arc:a}); }
    else {
      const key=p.id+'|'+cat;
      pts[start]=pts[start]||{};
      if(!pts[start][key]) pts[start][key]={count:0,cat,projName:p.name,projId:p.id};
      pts[start][key].count++;
    }
  })));
  return {pts,durs};
}
function assignLanes(durs){
  const sorted=[...durs].sort((a,b)=>a.start.localeCompare(b.start));
  const laneEnd=[];
  sorted.forEach(t=>{ let lane=0; while(lane<laneEnd.length && laneEnd[lane]>=t.start) lane++; laneEnd[lane]=t.end; t.lane=lane; });
}
function homeMonthShift(d){ let m=homeYM.m+d, y=homeYM.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} homeYM={y,m}; renderHome(); }
function homeMonthToday(){ const n=new Date(); homeYM={y:n.getFullYear(),m:n.getMonth()}; renderHome(); }
function renderHome(){
  const {y,m}=homeYM;
  const {pts,durs}=calItems(); assignLanes(durs);
  const startWd=new Date(y,m,1).getDay();
  const daysIn=new Date(y,m+1,0).getDate();
  const today=ymd(new Date());
  const cells=[]; for(let i=0;i<startWd;i++)cells.push(null);
  for(let d=1;d<=daysIn;d++)cells.push(new Date(y,m,d));
  while(cells.length%7)cells.push(null);
  const weeks=[]; for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));

  const weekHtml=weeks.map(week=>{
    const dayStr=week.map(d=>d?ymd(d):null);
    const daysHtml=week.map((dt,i)=>{
      if(!dt) return `<div class="cal-cell empty"></div>`;
      const ds=dayStr[i];
      const groups = pts[ds]?Object.values(pts[ds]):[];
      const badges=groups.map(g=>`<span class="cal-badge" style="background:${catColor(g.cat)}" title="${esc(g.projName)} › ${esc(g.cat)} · ${g.count}건" onclick="openProjectDetail('${g.projId}')">${g.count}</span>`).join('');
      return `<div class="cal-cell ${ds===today?'today':''}"><div class="cal-cell-top"><span class="cal-dnum">${dt.getDate()}</span><div class="cal-badges">${badges}</div></div></div>`;
    }).join('');
    const wkFirst=dayStr.find(x=>x), wkLast=[...dayStr].reverse().find(x=>x);
    let lanes=0;
    const bars=durs.filter(t=> t.end>=wkFirst && t.start<=wkLast).map(t=>{
      let sIdx=-1,eIdx=-1;
      for(let i=0;i<7;i++){ const x=dayStr[i]; if(!x)continue; if(x>=t.start && sIdx<0)sIdx=i; if(x<=t.end)eIdx=i; }
      if(sIdx<0||eIdx<sIdx) return '';
      lanes=Math.max(lanes,t.lane+1);
      const left=sIdx/7*100, width=(eIdx-sIdx+1)/7*100;
      return `<div class="cal-bar" title="${esc(t.title)} (${t.start}~${t.end})" onclick="openArcFromHome('${t.project.id}','${t.folder.id}','${t.arc.id}')" style="left:calc(${left}% + 3px);width:calc(${width}% - 6px);top:${t.lane*22}px;background:${catColor(t.cat)}">${esc(t.title)}</div>`;
    }).join('');
    return `<div class="cal-week"><div class="cal-grid">${daysHtml}</div><div class="cal-bars" style="height:${lanes?lanes*22+4:0}px">${bars}</div></div>`;
  }).join('');

  document.getElementById('viewArea').innerHTML=`
   <div class="home">
    ${guideBox("여기는 <b>홈</b>이에요. 달력에서 내가 어떤 날에 무슨 일을 끝냈는지 한눈에 볼 수 있어요. 동그라미 숫자는 그날 기록한 완성본 개수, 긴 막대는 며칠에 걸쳐 한 일이에요.")}
    <div class="cal-head">
      <button class="cal-nav" onclick="homeMonthShift(-1)">‹</button>
      <h2>${y}년 ${m+1}월</h2>
      <button class="cal-nav" onclick="homeMonthShift(1)">›</button>
      <span style="flex:1"></span>
      <button class="cal-today" onclick="homeMonthToday()">오늘</button>
    </div>
    <div class="cal-weekdays">${['일','월','화','수','목','금','토'].map((w,i)=>`<div class="${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}</div>
    <div class="cal-body">${weekHtml}</div>
    <div class="cal-legend">● 숫자 = 그 날 기록된 완성본 수 (프로젝트·분류별 묶음) · 막대 = 기간이 걸린 업무 (프로젝트&gt;분류)</div>
   </div>`;
}

/* ======================= 성과 대시보드 ======================= */
let dashMetric=null, dashPeriod='day';
function dashAllRows(){ const rows=[]; (WS().projects||[]).forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>(a.metrics||[]).forEach(r=>{ if(r.name&&r.value!==''&&r.value!=null&&!isNaN(Number(r.value))&&r.date) rows.push(r); })))); return rows; }
function wsStats(){
  const projects=WS().projects||[]; let arcs=0,completed=0,metricRows=0; const skills=new Set();
  projects.forEach(p=>{ if(p.status==='완료')completed++; (p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>{ arcs++; (a.metrics||[]).forEach(r=>{ if(r.value!==''&&r.value!=null)metricRows++; }); (a.skills||[]).forEach(s=>skills.add(s)); })); });
  return {arcs,completed,metricRows,skillCount:skills.size,projCount:projects.length,ongoing:projects.filter(p=>p.status==='진행중').length};
}
function metricImprovements(rows){
  const names=[...new Set(rows.map(r=>r.name))]; const out=[];
  names.forEach(n=>{ const ser=archiveSeries(rows,n,'day'); if(ser.length>=2){ const f=ser[0].value,l=ser[ser.length-1].value; if(f!==0){ out.push({name:n,pct:Math.round((l-f)/Math.abs(f)*100)}); } } });
  return out;
}
function battlePower(){
  const li=levelInfo(); const s=wsStats(); const imp=metricImprovements(dashAllRows()).length;
  return li.level*120 + s.arcs*25 + s.completed*60 + DB.account.streak.count*12 + (DB.account.qualityCount||0)*35 + s.skillCount*15 + imp*40;
}
function radarStats(){
  const s=wsStats(); const st=DB.account.streak.count, q=DB.account.qualityCount||0;
  return [
    {label:'기록력', v:Math.min(100,s.arcs*5)},
    {label:'꾸준함', v:Math.min(100,st*4)},
    {label:'분석력', v:Math.min(100,s.metricRows*3)},
    {label:'완성력', v:Math.min(100,s.completed*20)},
    {label:'정성', v:Math.min(100,q*20)},
    {label:'다재다능', v:Math.min(100,s.skillCount*12)},
  ];
}
function buildRadar(stats){
  const W=320,H=280,cx=160,cy=140,R=92,n=stats.length;
  const pt=(i,r)=>{ const ang=-Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]; };
  let grid=''; [25,50,75,100].forEach(g=>{ grid+=`<polygon points="${stats.map((_,i)=>pt(i,R*g/100).join(',')).join(' ')}" fill="none" stroke="#e6ece1" stroke-width="1"/>`; });
  let axes='',labels='';
  stats.forEach((s,i)=>{ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6ece1"/>`; const [lx,ly]=pt(i,R+20); labels+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11.5" fill="#5c625a" font-weight="600">${esc(s.label)}</text>`; });
  const poly=stats.map((s,i)=>pt(i,R*s.v/100).join(',')).join(' ');
  const dots=stats.map((s,i)=>{ const [x,y]=pt(i,R*s.v/100); return `<circle cx="${x}" cy="${y}" r="3.5" fill="#23a14e"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="radar-svg" xmlns="http://www.w3.org/2000/svg">${grid}${axes}<polygon points="${poly}" fill="#23a14e33" stroke="#23a14e" stroke-width="2"/>${dots}${labels}</svg>`;
}
function renderDashboard(){

  document.getElementById('viewArea').innerHTML=`

     ${guideBox("내가 쌓은 기록이 <b>능력치</b>가 되는 곳이에요. 기록할수록 전투력이 오르고, 지표 추이로 내 성장을 한눈에 볼 수 있어요.")}
     <div class="dash-grid">
       <div class="power-card">
         <div class="power-label">⚔️ 내 전투력</div>
         <div class="power-num" id="powerNum">0</div>
         <div class="power-sub">Lv.${li.level} · 완성본 ${s.arcs} · 완료 ${s.completed} · 🔥${DB.account.streak.count}일</div>
       </div>
       <div class="radar-card"><div class="card-h">능력치</div>${buildRadar(radarStats())}</div>

}

function currentProject(){ return DB.projects.find(x=>x.id===currentProjectId); }

function usedSkills(){ const set=new Set(); DB.projects.forEach(p=>(p.folders||[]).forEach(f=>(f.archives||[]).forEach(a=>(a.skills||[]).forEach(s=>set.add(s))))); return Array.from(set); }

/* 기존 평면 archives → 카테고리별 폴더로 자동 이전 */
function ensureFolders(p){
  if(!p.folders) p.folders=[];
  if(p.archives && p.archives.length){
    p.archives.forEach(a=>{
      const name=a.category||'기타';
      let f=p.folders.find(x=>x.name===name);
      if(!f){ f={id:uid(),name,status:'진행중',createdAt:Date.now(),archives:[]}; p.folders.push(f); }
      f.archives.push(a);
    });
    delete p.archives; save();
  }
  p.folders.forEach(f=>{ if(!f.status) f.status='진행중'; });
}

function openProject(id){ openProjectDetail(id); }
function openProjectDetail(id){
  currentProjectId=id; currentFolderId=null; view='proj';

  document.getElementById('navChat').classList.remove('active');

}

        <span class="spacer"></span>

      </div>

function setProjStatus(s){
  const p=currentProject(); if(!p)return;
  const newlyClear = (s==='완료' && p.status!=='완료' && !p.cleared);
  p.status=s;

  else save();
  renderProjectDetail();
}
function deleteProject(id){
  if(!confirm('이 프로젝트를 삭제할까요? (채팅 기록은 남습니다)'))return;
  DB.projects=DB.projects.filter(x=>x.id!==id);
  DB.channels.forEach(c=>c.projectIds=(c.projectIds||[]).filter(pid=>pid!==id));
  save(); renderProjects();
}

function openArchiveEditor(id){
  const f=currentFolder(); if(!f)return;
  if(id){
    const a=f.archives.find(x=>x.id===id);
    draft=JSON.parse(JSON.stringify(a));
    draft.story=draft.story||{계기:'',의도:'',고민:'',과정:'',회고:''};
    draft.files=draft.files||[];
    draft.metrics=draft.metrics||[];

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'lvup-log');

  const res = await fetch('https://api.cloudinary.com/v1_1/dp7shsjb9/image/upload', {
    method: 'POST',
    body: formData
  });

  if(!res.ok){
    throw new Error('Cloudinary 업로드 실패');
  }

  const data = await res.json();
  return data.secure_url;
}

/* ======================= 성과 지표 (완성본 단위) ======================= */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoWeekKey(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const yStart=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil(((t-yStart)/86400000+1)/7);
  return `${t.getUTCFullYear()}-W${pad(wk)}`;
}
/* draft.metrics([{date,name,value}]) → 기간별 평균 시계열 */
function archiveSeries(rows, name, period){
  const buckets={};
  rows.forEach(r=>{
    if(r.name!==name || !r.date) return;
    if(r.value===''||r.value==null||isNaN(Number(r.value))) return;
    const d=new Date(r.date); let key;
    if(period==='day') key=r.date;
    else if(period==='week') key=isoWeekKey(d);
    else key=r.date.slice(0,7);
    (buckets[key]=buckets[key]||[]).push(Number(r.value));
  });
  return Object.keys(buckets).sort().map(k=>({label:k, value:+(buckets[k].reduce((a,b)=>a+b,0)/buckets[k].length).toFixed(2)}));
}
/* 의존성 없는 SVG 라인차트 */
function buildLineChart(series, name, opts){
  opts=opts||{};
  const hv=!!opts.hideValues;   // 수치 라벨 숨김(포트폴리오 유출 방지)
  if(!series.length) return '<div style="color:var(--muted);padding:40px;text-align:center">아직 데이터가 없어요. 위에서 날짜별 값을 입력해 보세요.</div>';
  const W=820,H=300,padL=hv?20:56,padR=20,padT=20,padB=46;
  const iw=W-padL-padR, ih=H-padT-padB;
  const vals=series.map(s=>s.value);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ const d=Math.abs(min)||1; min-=d*0.5; max+=d*0.5; }
  const pd=(max-min)*0.1; min-=pd; max+=pd;
  const n=series.length;
  const x=i=> n===1 ? padL+iw/2 : padL + iw*i/(n-1);
  const y=v=> padT + ih*(1-(v-min)/(max-min));
  // 가로 그리드 (+ 수치 라벨은 hv가 아닐 때만)
  let grid='', ticks=4;
  for(let i=0;i<=ticks;i++){
    const gv=min+(max-min)*i/ticks; const gy=y(gv);
    grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#1f5d2420" stroke-width="1"/>`;
    if(!hv) grid+=`<text x="${padL-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#7aa078">${fmtNum(gv)}</text>`;
  }
  // x라벨 (너무 많으면 솎음)
  const step=Math.ceil(n/8);
  let xlab='';
  series.forEach((s,i)=>{ if(i%step===0||i===n-1){ xlab+=`<text x="${x(i)}" y="${H-padB+22}" text-anchor="middle" font-size="11" fill="#7aa078">${xLabel(s.label)}</text>`; } });
  // 라인 + 영역
  const linePts=series.map((s,i)=>`${x(i)},${y(s.value)}`).join(' ');
  const area=`${padL},${padT+ih} ${linePts} ${x(n-1)},${padT+ih}`;
  const dots=series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.value)}" r="4" fill="#2e7d32"><title>${esc(s.label)}${hv?'':' · '+s.value}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ec43e" stop-opacity=".35"/><stop offset="1" stop-color="#3ec43e" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#cg)"/>
    <polyline points="${linePts}" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
  </svg>`;
}
function fmtNum(v){ const a=Math.abs(v); if(a>=10000) return (v/1000).toFixed(0)+'k'; if(a>=100) return Math.round(v); return +v.toFixed(2); }
function xLabel(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)) return k.slice(5); if(/W/.test(k)) return k.slice(5); if(/^\d{4}-\d{2}$/.test(k)) return k.slice(2); return k; }

function portfolioMetrics(a){
  const rows=(a.metrics||[]).filter(r=>r.name && r.value!=='' && r.value!=null && !isNaN(Number(r.value)) && r.date);
  const names=Array.from(new Set(rows.map(r=>r.name)));
  if(!names.length) return '';
  const pctLines=[], charts=[];
  names.forEach(n=>{
    const daily=archiveSeries(rows,n,'day');
    if(daily.length>=2){
      const first=daily[0].value, last=daily[daily.length-1].value;
      if(first!==0){
        const pct=Math.round((last-first)/Math.abs(first)*100);
        if(pct!==0) pctLines.push(`${esc(n)} <b>${Math.abs(pct)}% ${pct>0?'증가':'감소'}</b>`);
      }
      const month=archiveSeries(rows,n,'month'), week=archiveSeries(rows,n,'week');
      let ser=daily, lab='일';
      if(month.length>=2){ ser=month; lab='월'; } else if(week.length>=2){ ser=week; lab='주'; }
      charts.push(`<div class="pf-chart"><div class="pf-chart-cap">${esc(n)} 추이 (${lab}별)</div>${buildLineChart(ser,n,{hideValues:true})}</div>`);
    }
  });
  if(!pctLines.length && !charts.length) return '';
  return `<div class="pf-metrics">
    ${pctLines.length?`<div class="pf-result"><b>📊 성과</b> ${pctLines.join(' · ')}</div>`:''}
    ${charts.length?`<div class="pf-charts">${charts.join('')}</div>`:''}
  </div>`;
}
function generatePortfolio(){
  const p=currentProject();
  const name=(document.getElementById('pfName').value||DB.user.name).trim();
  const headline=document.getElementById('pfHeadline').value.trim();
  const picks=projArchives(p).filter(x=>portfolioSel.includes(x.a.id));
  if(!picks.length){ alert('완성본을 하나 이상 선택하세요.'); return; }
  if(!DB.account.portfolioMade){ DB.account.portfolioMade=true; save(); checkAchievements(); }
  closeModal();
  const skillSet=Array.from(new Set(picks.flatMap(x=>x.a.skills||[])));
  const blocks=picks.map(({f,a})=>{
    const story=a.story||{};
    const storyRows=[['만들게 된 계기 / 배경','계기'],['기획의도 / 목표','의도'],['핵심 고민 / 선택','고민'],['진행 과정','과정'],['회고 / 배운 점','회고']]
      .filter(([,k])=>story[k] && story[k].trim())
      .map(([label,k])=>`<div class="pf-srow"><div class="pf-slabel">${label}</div><div class="pf-stext">${esc(story[k])}</div></div>`).join('');
    const imgs=(a.images&&a.images.length)
      ? `<div class="pf-imgs">${a.images.map(src=>`<div class="pf-img-box"><img src="${src}"></div>`).join('')}</div>` : '';
    const links=(a.links||'').split('\n').filter(s=>s.trim()).map(s=>`<div class="pf-link">${esc(s.trim())}</div>`).join('');
    return `<section class="pf-block">
      <div class="pf-bhead">
        <h2>${esc(a.title)}</h2>
        <div class="pf-tags">${esc(a.category||'')} · ${esc(periodLabel(a))} · 기여도 ${a.contribution||100}%</div>
      </div>
      <div class="pf-meta">${esc(f.name)}</div>
      ${a.summary?`<p class="pf-summary">${esc(a.summary)}</p>`:''}
      ${a.result?`<div class="pf-result"><b>📈 성과 요약</b> ${esc(a.result)}</div>`:''}
      ${portfolioMetrics(a)}
      ${imgs}
      ${storyRows}
      ${(a.skills&&a.skills.length)?`<div class="pf-skills">${a.skills.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
      ${links}
    </section>`;
  }).join('');
  const doc=document.createElement('div');
  doc.id='portfolioPrint';
  doc.innerHTML=`
    <div class="pf-toolbar">
      <button class="btn-cancel" onclick="closePortfolio()">닫기</button>
      <button class="btn-primary" onclick="window.print()">PDF로 저장 (인쇄)</button>
    </div>
    <div class="pf-page">
      <header class="pf-top">
        <div class="pf-name">${esc(name)}</div>
        ${headline?`<div class="pf-headline">${esc(headline)}</div>`:''}
        ${skillSet.length?`<div class="pf-skills pf-top-skills">${skillSet.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
        <div class="pf-divider"></div>
        <div class="pf-doctitle">${esc(p.name)} · Work Portfolio · ${picks.length}건</div>
      </header>
      ${blocks}
      <footer class="pf-foot">LVUP.log 에서 생성 · ${todayStr()}</footer>
    </div>`;
  document.body.appendChild(doc);
}
