function renderChat(){
  const area=document.getElementById('viewArea');
  if(DB.channels.length && !activeChannel) activeChannel=DB.channels[0].id;
  const list = DB.channels.map(c=>`
    <div class="chan ${c.id===activeChannel?'active':''}" onclick="selectChannel('${c.id}')">
      <span style="color:${c.color};font-size:1.1rem">●</span>
      <span>${esc(c.name)}</span>
      ${c.private?'<span class="lock">🔒</span>':''}
      <span class="arrow">→</span>
    </div>`).join('');

  area.innerHTML=`
   <div class="chat-layout">
    <div class="chan-list">
      ${guideBox("일하면서 떠오른 메모나 진행 상황을 <b>편하게 적어두는 곳</b>이에요. 나중에 의미 있는 건 완성본으로 정리하면 돼요.")}
      <div class="chan-scroll">${list || '<div style="color:var(--muted);padding:10px">아직 채팅방이 없어요.</div>'}</div>
      <div class="new-chan" onclick="openChannelModal()">+ 새 채팅</div>
    </div>
    <div class="chat-main" id="chatMain"></div>
    <div class="chat-side" id="chatSide"></div>
   </div>`;
  renderActiveChannel();
}

function selectChannel(id){ activeChannel=id; replyTarget=null; renderChat(); }
function gotoChannel(id){ go('chat'); activeChannel=id; replyTarget=null; renderChat(); }

function renderActiveChannel(){
  const main=document.getElementById('chatMain');
  const side=document.getElementById('chatSide');
  if(!main) return;
  const c=DB.channels.find(x=>x.id===activeChannel);
  if(!c){
    main.innerHTML=`<div class="empty-chat">왼쪽에서 채팅방을 선택하거나<br><b>+ 새 채팅</b>으로 첫 기록을 시작하세요.</div>`;
    side.innerHTML=''; return;
  }
  const msgs = c.messages.slice().reverse().map(m=>{
    const ctx = m.replyTo ? `<div class="reply-ctx">↳ ${esc(snippet(findMsg(c,m.replyTo)))}</div>` : '';
    return `<div class="msg ${m.replyTo?'reply':''}">
      ${ctx}
      <div class="bubble">${esc(m.text)}</div>
      <div class="msg-meta">
        <span>${fmtTime(m.ts)}${m.edited?' · 수정됨':''}</span>
        <button onclick="startReply('${m.id}')">답글</button>
        <button onclick="editMsg('${m.id}')">수정</button>
        <button class="del-msg" onclick="delMsg('${m.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');

  const replyBar = replyTarget
    ? `<div class="replying-bar">↳ ${esc(snippet(findMsg(c,replyTarget)))} <button onclick="cancelReply()">취소</button></div>` : '';

  main.innerHTML=`
    <div class="chat-head">
      <span style="color:${c.color};font-size:1.3rem">●</span>
      <h2>${esc(c.name)}</h2>
      <span class="tool" title="내보내기" onclick="exportChannel('${c.id}')">⤓</span>
      <div class="right">
        <span class="tool" title="${c.private?'개인':'공유'}" onclick="togglePrivate('${c.id}')">${c.private?'🔒':'🌐'}</span>
        <span class="tool" title="채팅방 삭제" onclick="deleteChannel('${c.id}')">🗑</span>
      </div>
    </div>
    <div class="composer">
      <textarea id="msgInput" placeholder="지금 한 일을 기록하세요...  (Enter 전송 · Shift+Enter 줄바꿈)" onkeydown="msgKey(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'"></textarea>
      <div class="composer-row">
        <span class="hint">빠르게 적고, 정리는 나중에. 메시지마다 +10 XP</span>
        <button class="send" onclick="sendMessage()">전송</button>
      </div>
    </div>
    ${replyBar}
    <div class="msgs" id="msgScroll">${msgs || '<div class="empty-chat">첫 메시지를 남겨보세요. 메시지마다 +10 XP! ✏️</div>'}</div>`;

  // 관련 프로젝트 사이드바
  const linked = DB.projects.filter(p=>(c.projectIds||[]).includes(p.id));
  const rel = linked.map(p=>`<div class="rel-proj" onclick="go('proj');setTimeout(()=>openProject('${p.id}'),50)">${esc(p.name)} <span class="arrow">→</span></div>`).join('');
  side.innerHTML=`
    <h3>관련 프로젝트</h3>
    ${rel || '<div style="color:var(--muted);font-size:.88rem;margin-bottom:12px">연결된 프로젝트가 없습니다.</div>'}
    <div class="rel-add" onclick="openLinkModal('${c.id}')">+ 프로젝트 연결</div>`;

  const sc=document.getElementById('msgScroll'); if(sc) sc.scrollTop=0;
  const mi=document.getElementById('msgInput'); if(mi) mi.focus();
}

function openChannelModal(){
  modal(`
    <h3>새 채팅</h3>
    <input id="mChanName" placeholder="채팅방 이름 (예: 광고소재, CPA 이상 현상)">
    <div>색상</div>
    <div class="color-pick" id="mColors">
      ${HEART_COLORS.map((c,i)=>`<span data-c="${c}" class="${i===1?'sel':''}" style="background:${c}" onclick="pickColor(this)"></span>`).join('')}
    </div>
    <div>공개 범위</div>
    <div class="row" id="mPriv">
      <div class="opt sel" data-v="0">🌐 공유</div>
      <div class="opt" data-v="1">🔒 개인</div>
    </div>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="createChannel()">생성 (+20 XP)</button>
    </div>`);
  document.querySelectorAll('#mPriv .opt').forEach(o=>o.onclick=()=>{
    document.querySelectorAll('#mPriv .opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');
  });
}
function pickColor(el){ document.querySelectorAll('#mColors span').forEach(s=>s.classList.remove('sel')); el.classList.add('sel'); }
function createChannel(){
  const name=document.getElementById('mChanName').value.trim();
  if(!name){ alert('이름을 입력하세요.'); return; }
  const color=document.querySelector('#mColors span.sel').dataset.c;
  const priv=document.querySelector('#mPriv .opt.sel').dataset.v==='1';
  const c={ id:uid(), name, color, private:priv, projectIds:[], messages:[] };
  DB.channels.push(c); save();
  closeModal();
  activeChannel=c.id;
  addXP(XP.channel); playSound('create'); comboHit();
  renderChat();
}

function sendMessage(){
  const inp=document.getElementById('msgInput'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  const c=DB.channels.find(x=>x.id===activeChannel); if(!c) return;
  c.messages.push({ id:uid(), text, ts:Date.now(), replyTo:replyTarget, edited:false });
  // 연결된 모든 프로젝트에 XP 적립
  (c.projectIds||[]).forEach(pid=>{ const p=DB.projects.find(x=>x.id===pid); if(p)p.xp=(p.xp||0)+XP.message; });
  save();
  replyTarget=null;
  addXP(XP.message);            // user XP (프로젝트는 위에서 별도 적립)
  playSound('create'); comboHit();
  renderActiveChannel();
}
function msgKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } }
function startReply(mid){ replyTarget=mid; renderActiveChannel(); document.getElementById('msgInput').focus(); }
function cancelReply(){ replyTarget=null; renderActiveChannel(); }
function editMsg(mid){
  const c=DB.channels.find(x=>x.id===activeChannel); const m=findMsg(c,mid); if(!m)return;
  const t=prompt('메시지 수정',m.text); if(t===null)return;
  m.text=t.trim(); m.edited=true; m.editedTs=Date.now(); save(); renderActiveChannel();
}
function delMsg(mid){
  if(!confirm('이 메시지를 삭제할까요?'))return;
  const c=DB.channels.find(x=>x.id===activeChannel);
  c.messages=c.messages.filter(m=>m.id!==mid); save(); renderActiveChannel();
}
function togglePrivate(cid){ const c=DB.channels.find(x=>x.id===cid); c.private=!c.private; save(); renderChat(); }
function deleteChannel(cid){
  if(!confirm('이 채팅방을 삭제할까요? 모든 메시지가 사라집니다.'))return;
  DB.channels=DB.channels.filter(c=>c.id!==cid);
  DB.projects.forEach(p=>p.channelIds=p.channelIds.filter(id=>id!==cid));
  activeChannel=DB.channels[0]?DB.channels[0].id:null;
  save(); renderChat();
}

/* 채팅방 ↔ 프로젝트 연결 */
function openLinkModal(cid){
  const c=DB.channels.find(x=>x.id===cid);
  if(!DB.projects.length){ alert('먼저 프로젝트를 생성하세요.'); return; }
  const items=DB.projects.map(p=>{
    const on=(c.projectIds||[]).includes(p.id);
    return `<div class="opt ${on?'sel':''}" style="text-align:left" onclick="toggleLink('${cid}','${p.id}',this)">${on?'✓ ':''}${esc(p.name)}</div>`;
  }).join('');
  modal(`<h3>프로젝트 연결</h3>
    <div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto">${items}</div>
    <div class="actions"><button class="btn-primary" onclick="closeModal();renderChat()">완료</button></div>`);
}
function toggleLink(cid,pid,el){
  const c=DB.channels.find(x=>x.id===cid); const p=DB.projects.find(x=>x.id===pid);
  c.projectIds=c.projectIds||[];
  if(c.projectIds.includes(pid)){
    c.projectIds=c.projectIds.filter(x=>x!==pid);
    p.channelIds=p.channelIds.filter(x=>x!==cid);
    el.classList.remove('sel'); el.textContent=esc(p.name);
  }else{
    c.projectIds.push(pid); p.channelIds.push(cid);
    el.classList.add('sel'); el.textContent='✓ '+p.name;
  }
  save();
}

/* 내보내기 (Markdown) */
function exportChannel(cid){
  const c=DB.channels.find(x=>x.id===cid);
  let md=`# ${c.name}\n\n`;
  c.messages.forEach(m=>{
    md+=`**${fmtFull(m.ts)}**\n`;
    if(m.replyTo) md+=`> ↳ ${snippet(findMsg(c,m.replyTo))}\n`;
    md+=m.text+'\n\n';
  });
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`${c.name}.md`; a.click();
  toast('Markdown으로 내보냈습니다 ⤓');
}

/* ======================= 검색 ======================= */
function doSearch(q){
  q=q.trim().toLowerCase();
  const box=document.getElementById('searchResults');
  if(!q){ box.classList.add('hidden'); return; }
  const res=[];
  DB.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q)) res.push({type:'프로젝트',label:p.name,act:()=>openProjectDetail(p.id)});
    (p.folders||[]).forEach(f=>{
      if(f.name.toLowerCase().includes(q)) res.push({type:'작업 영역 · '+p.name,label:f.name,act:()=>{ currentProjectId=p.id; ensureFolders(p); openFolder(f.id); }});
      (f.archives||[]).forEach(a=>{
        const hay=[a.title,a.summary,a.result,a.story&&Object.values(a.story).join(' ')].join(' ').toLowerCase();
        if(hay.includes(q)) res.push({type:'완성본 · '+f.name,label:a.title,act:()=>{ currentProjectId=p.id; ensureFolders(p); currentFolderId=f.id; openArchiveEditor(a.id); }});
      });
    });
  });
  DB.channels.forEach(c=>{
    if(c.name.toLowerCase().includes(q)) res.push({type:'채팅방',label:c.name,act:()=>gotoChannel(c.id)});
    c.messages.forEach(m=>{ if(m.text.toLowerCase().includes(q)) res.push({type:'메시지 · '+c.name,label:snippet(m),act:()=>gotoChannel(c.id)}); });
  });
  box.innerHTML = res.length
    ? res.slice(0,30).map((r,i)=>`<div class="sr" onclick="runSearch(${i})"><small>${esc(r.type)}</small><br>${esc(r.label)}</div>`).join('')
    : '<div class="empty">검색 결과가 없습니다.</div>';
  box.classList.remove('hidden');
  window.__searchRes=res;
}
function runSearch(i){ const r=window.__searchRes[i]; closeSearch(); document.getElementById('searchBox').value=''; if(r)r.act(); }
function closeSearch(){ document.getElementById('searchResults').classList.add('hidden'); }

 /* ======================= 전체 초기화 ======================= */ 
async function resetAll(){
  if(!confirm('모든 데이터를 삭제하고 처음으로 돌아갑니다. 계속할까요?')) return;

  const userId = DB && DB.auth && DB.auth.id;

  try{
    if(userId){
      await firestore.collection("users").doc(userId).delete();
      console.log("☁️ Firestore 데이터 삭제 완료");
    }

    localStorage.removeItem(STORE_KEY);
    alert('전체 초기화 완료! 처음 화면으로 돌아갑니다.');
    location.reload();
  }catch(e){
    console.error(e);
    alert('초기화 중 문제가 생겼어요. 다시 시도해주세요.');
  }
}

/* ======================= 유틸 ======================= */
function findMsg(c,id){ return c.messages.find(m=>m.id===id); }
function snippet(m){ if(!m)return '(삭제된 메시지)'; return m.text.length>40?m.text.slice(0,40)+'…':m.text; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pad(n){ return n<10?'0'+n:n; }
function fmtTime(ts){ const d=new Date(ts); const h=d.getHours(); const ap=h<12?'오전':'오후'; const h12=h%12||12; return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${ap} ${h12}:${pad(d.getMinutes())}`; }
function fmtFull(ts){ const d=new Date(ts); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts){ const d=new Date(ts); return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`; }

/* 모달 */
function modal(html){ closeModal(); const o=document.createElement('div'); o.className='overlay'; o.id='overlay'; o.onclick=e=>{if(e.target===o)closeModal();}; o.innerHTML=`<div class="modal">${html}</div>`; document.body.appendChild(o); }
function closeModal(){ const o=document.getElementById('overlay'); if(o)o.remove(); }

/* 토스트 / 레벨업 */
let toastTimer=null;
function toast(msg,xp){ const old=document.querySelector('.toast'); if(old)old.remove(); const t=document.createElement('div'); t.className='toast'+(xp?' xp':''); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),1800); }
function levelUp(lv){
  const un=[...AVATARS.filter(a=>a.lv===lv).map(a=>a.emoji), ...FRAMES.filter(f=>f.lv===lv).map(f=>'배경:'+f.name), ...TITLES.filter(t=>t.lv===lv).map(t=>'“'+t.name+'”')];
  const unlockHtml = un.length?`<div class="lvunlock">🎁 새 꾸미기 해금! ${un.join(' ')}</div>`:'';
  const o=document.createElement('div'); o.className='levelup';
  o.innerHTML=`<div class="lvflash"></div><div class="lvring"></div><div class="card"><div class="lvlabel">LEVEL UP!</div><div class="big">Lv. ${lv}</div><div class="lvsub">레벨이 올랐어요 🎉</div>${unlockHtml}</div>`;
  document.body.appendChild(o);
  playSound('level');
  confetti(140); setTimeout(()=>confetti(80),280); setTimeout(()=>confetti(60),560);
  setTimeout(()=>o.remove(),2400);
}

/* XP 플로팅 + 스파클 + 색종이 + 버튼 리플 */
function xpFloat(n){
  const e=document.createElement('div'); e.className='xpfloat'; e.textContent='+'+n+' XP';
  document.body.appendChild(e); setTimeout(()=>e.remove(),1300);
  sparkle(window.innerWidth/2, window.innerHeight*0.18, 12);
}
function sparkle(x,y,count){
  const cols=['#ffd400','#3ec43e','#23a14e','#ffffff','#a7ff8a'];
  for(let i=0;i<(count||8);i++){
    const s=document.createElement('div'); s.className='spark';
    const ang=Math.random()*Math.PI*2, dist=44+Math.random()*80;
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.color=cols[i%cols.length]; s.style.background=cols[i%cols.length];
    s.style.setProperty('--sx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--sy',Math.sin(ang)*dist+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),720);
  }
}
function confetti(num){
  const colors=['#3ec43e','#bfe6a0','#23a14e','#f59e0b','#ec4899','#3b82f6','#ffd400','#ff7043','#a78bfa'];
  const N=num||90;
  for(let i=0;i<N;i++){
    const c=document.createElement('div'); c.className='confetti';
    const sz=6+Math.random()*8;
    c.style.width=sz+'px'; c.style.height=(sz*(1+Math.random()))+'px';
    if(Math.random()<.32) c.style.borderRadius='50%';
    c.style.left=(50+(Math.random()*64-32))+'%';
    c.style.background=colors[i%colors.length];
    c.style.setProperty('--dx',(Math.random()*460-230)+'px');
    c.style.setProperty('--dy',(260+Math.random()*380)+'px');
    c.style.setProperty('--rot',(Math.random()*1280-640)+'deg');
    c.style.animationDelay=(Math.random()*0.25)+'s';
    c.style.animationDuration=(1.5+Math.random()*0.9)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),2600);
  }
}
/* ---------- 효과음 (Web Audio 합성, 외부 파일 없음) ---------- */
let _actx=null;
function actx(){ if(!_actx){ try{ _actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _actx=null; } } return _actx; }
function tone(freq,start,dur,vol,type){
  const ctx=actx(); if(!ctx)return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'triangle'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
  const t=ctx.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.03);
}
function playSound(name,arg){
  if(DB && DB.account && DB.account.soundOn===false) return;
  const ctx=actx(); if(!ctx) return; if(ctx.state==='suspended') ctx.resume();
  const v=0.12;
  if(name==='click'){ tone(700,0,0.05,0.06,'sine'); }
  else if(name==='create'){ /* 통통 튀는 팝(사각파) */ tone(523,0,0.06,v,'square'); tone(784,0.05,0.09,v,'square'); }
  else if(name==='save'){ /* 밝고 풍성한 3음 차임 */ tone(659,0,0.10,v,'triangle'); tone(988,0.09,0.11,v,'triangle'); tone(1319,0.19,0.20,v*1.05,'sine'); }
  else if(name==='combo'){ const f=600+Math.min(arg||0,14)*65; tone(f,0,0.09,v,'square'); tone(f*1.5,0.05,0.08,v*0.8,'square'); }
  else if(name==='level'){ [523,659,784,1046,1319].forEach((f,i)=>tone(f,i*0.085,0.22,v,'triangle')); }
  else if(name==='ach'){ tone(1318,0,0.09,v,'triangle'); tone(1760,0.07,0.13,v,'triangle'); tone(2093,0.15,0.14,v,'triangle'); }
}

/* ---------- 콤보 시스템 ---------- */
let comboCount=0, comboLast=0, comboTimer=null;
const COMBO_WINDOW=600000;   // 10분 안에 연달아 기록하면 콤보 유지
function comboHit(){
  const now=Date.now();
  comboCount = (now-comboLast<COMBO_WINDOW) ? comboCount+1 : 1;
  comboLast=now;
  clearTimeout(comboTimer); comboTimer=setTimeout(()=>{ comboCount=0; },COMBO_WINDOW);
  if(comboCount>=2){
    showCombo(comboCount);
    const bonus=Math.min(30,(comboCount-1)*3);   // 2콤보 +3, 3콤보 +6 … 최대 +30
    const before=levelInfo().level;
    DB.user.xp+=bonus; save();
    const after=levelInfo().level;
    if(after>before) setTimeout(()=>levelUp(after),400);
  }
}
function showCombo(n){
  const old=document.querySelector('.combo-pop'); if(old)old.remove();
  const e=document.createElement('div'); e.className='combo-pop';
  e.style.setProperty('--ch', Math.min(40+n*16,330));   // 콤보 높을수록 색 변화
  e.innerHTML=`<span class="combo-n">${n}</span><span class="combo-x">COMBO!</span><span class="combo-b">+${Math.min(30,(n-1)*3)} XP</span>`;
  document.body.appendChild(e);
  sparkle(window.innerWidth/2, window.innerHeight*0.30, Math.min(6+n,18));
  playSound('combo', n);
  setTimeout(()=>e.remove(),950);
}

const RIPPLE_SEL='.nav-btn,.pill,.send,.btn-primary,.btn-cancel,.add-archive,.opt,.skill-tg,.story-toggle,.new-chan,.rel-add,.arc-new,.proj-card.new,.contrib-row .opt';
const SPARK_SEL=RIPPLE_SEL+',.proj-card,.arc-card,.chan,.ws-card,.cz-av,.cz-frame';
document.addEventListener('click',e=>{
  // 클릭 위치 스파크 + 효과음 (버튼·카드류)
  if(e.target.closest(SPARK_SEL)){ sparkle(e.clientX, e.clientY, 5); playSound('click'); }
  // 리플
  const el=e.target.closest(RIPPLE_SEL); if(!el)return;
  const r=document.createElement('span'); r.className='rp';
  const rect=el.getBoundingClientRect(); const d=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=d+'px';
  r.style.left=(e.clientX-rect.left-d/2)+'px';
  r.style.top=(e.clientY-rect.top-d/2)+'px';
  el.appendChild(r); setTimeout(()=>r.remove(),600);
});
